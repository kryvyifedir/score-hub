<template>
  <div class="slds-grid" style="position: relative; height: 100%; overflow:hidden;">
    <div class="slds-col slds-size_1-of-3 slds-var-p-horizontal_xx-small">
      <c-score-hub-home-column hide-header="hide">
        <div slot="content">
          <c-current-user-card></c-current-user-card>
          <c-current-user-achievements></c-current-user-achievements>
        </div>
      </c-score-hub-home-column>
    </div>

    <div class="slds-col slds-size_1-of-3 slds-var-p-horizontal_xx-small">
      <c-score-hub-home-column>
        <c-score-hub-home-column-header header-title={labels.TopUsersLabel} header-icon="standard:groups" slot="header"></c-score-hub-home-column-header>
        <c-leaderboard slot="content"></c-leaderboard> 
      </c-score-hub-home-column>
    </div>

    <div class="slds-col slds-size_1-of-3 slds-var-p-horizontal_xx-small">
      <c-score-hub-home-column>
        <c-score-hub-home-column-header header-title={seasonsColumnHeader} header-icon="standard:goals" slot="header">
          <lightning-button-icon slot="buttonLeft" icon-name="utility:back" variant="border-filled" alternative-text="back"
            title="back" onclick={backButtonClick} disabled={isBackButtonDisabled}></lightning-button-icon>
          <lightning-button-icon slot="buttonRight" icon-name="utility:forward" variant="border-filled" alternative-text="back"
            title="forward" onclick={forwardButtonClick} disabled={isForwardButtonDisabled} class="slds-var-p-left_xx-small"></lightning-button-icon>
        </c-score-hub-home-column-header>
        <c-seasons-leaderboard slot="content" onchanged={handleLeaderboardChange}></c-seasons-leaderboard>
      </c-score-hub-home-column>
    </div>
  </div>
</template>
