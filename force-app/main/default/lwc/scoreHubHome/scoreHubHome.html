<template>
  <div class="slds-grid" style="position: relative; height: 100%; overflow:hidden;">
    <div class="slds-col slds-size_1-of-3 slds-var-m-horizontal_xx-small">
      <c-score-hub-home-column>
        <div slot="content">
          <c-current-user-card></c-current-user-card>
          <c-current-user-achievements></c-current-user-achievements>
          <!-- <div class="slds-box slds-var-m-around_small" >
            <c-current-user-achievements></c-current-user-achievements>
          </div> -->
        </div>
      </c-score-hub-home-column>
    </div>

    <div class="slds-col slds-size_1-of-3 slds-var-m-horizontal_xx-small">
      <c-score-hub-home-column>
        <header class="slds-media slds-media_center slds-has-flexi-truncate" slot="header">
          <div class="slds-media__figure">
            <span class="slds-icon_container slds-icon-standard-account" title="account">
              <lightning-icon alternative-text={labels.TopUsersLabel} icon-name="standard:groups">
              </lightning-icon>
              <span class="slds-assistive-text">{labels.TopUsersLabel}</span>
            </span>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              <span>{labels.TopUsersLabel}</span>
            </h2>
          </div>
        </header>
        <c-leaderboard slot="content"></c-leaderboard> 
      </c-score-hub-home-column>
    </div>

    <div class="slds-col slds-size_1-of-3 slds-var-m-horizontal_xx-small">
      <c-score-hub-home-column>
        <c-seasons-leaderboard slot="content"></c-seasons-leaderboard>
      </c-score-hub-home-column>
    </div>
  </div>
</template>
